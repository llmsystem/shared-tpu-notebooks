# Keep JupyterHub available while student and TA TPU notebook Pods run.
# System-critical DaemonSets can still preempt either class when necessary.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: jupyterhub-core
value: 900000
globalDefault: false
description: "Hub and proxy serving all notebook sessions."
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: student-notebook
value: 800000
globalDefault: false
description: "An interactive TPU notebook for a student or TA."
